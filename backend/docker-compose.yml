services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-300}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../frontend:/app
      - uniplace_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uniplace}
      POSTGRES_USER: ${DB_USER:-uniplace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uniplace_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - uniplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uniplace_postgres_data:
  uniplace_node_modules:
